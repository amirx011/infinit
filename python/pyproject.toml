[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinit-engine"
version = "1.0.0"
description = "SymPy reference oracle for Infinit Lab"
requires-python = ">=3.11"
dependencies = ["sympy>=1.14"]

[project.scripts]
infinit-oracle = "infinit_engine.__main__:main"

[tool.setuptools]
packages = ["infinit_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
