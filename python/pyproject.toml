[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odelab-engine"
version = "1.0.0"
description = "SymPy reference oracle for ODE Lab"
requires-python = ">=3.11"
dependencies = ["sympy>=1.14"]

[project.scripts]
odelab-oracle = "odelab_engine.__main__:main"

[tool.setuptools]
packages = ["odelab_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
